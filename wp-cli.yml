# WP-CLI project configuration — https://wp-cli.org/config/
#
# Usage from a checkout of this repo:
#   wp @staging option get blogname
#   wp @staging plugin list
#
# The @staging alias runs WP-CLI on the staging server over SSH. Fill in the
# real SSH user/host/path once server credentials are provisioned (the same
# values used by the deploy workflow secrets).

@staging:
  ssh: SSH_USER@STAGING_SSH_HOST/ABSOLUTE/PATH/TO/WORDPRESS
  url: https://staging.uberrito.com
